image: python:3.12.16

stages:
  - lint
  - security_scan
  - test
  - tag

# Shared pip cache, invalidated when either dependency lock changes.
.pip_cache: &pip_cache
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip
    policy: pull-push

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.python_job:
  <<: *pip_cache
  before_script:
    - python -m pip install --upgrade pip==26.3
    - python -m pip install --require-hashes -r requirements-dev.txt

ruff_lint:
  extends: .python_job
  stage: lint
  script:
    - ruff check .

black_formatting_check:
  extends: .python_job
  stage: lint
  variables:
    WORKDIR: "."
  script:
    - black "$WORKDIR" --check --verbose --diff --color

security_scan_pip_audit:
  extends: .python_job
  stage: security_scan
  script:
    # The development lock includes the complete runtime lock and all CI tools.
    - pip-audit --strict --require-hashes --disable-pip -r requirements-dev.txt

security_scan_bandit:
  extends: .python_job
  stage: security_scan
  script:
    # -ll = medium severity and above; -ii = medium confidence and above
    - bandit -r whatismyip/ -ll -ii --exclude whatismyip/extreme.py

run_tests:
  extends: .python_job
  stage: test
  script:
    # extreme.py and utils.py are external-API clients; omit from threshold.
    - pytest tests/ -v --cov=whatismyip --cov-fail-under=50 --cov-report=term-missing --cov-config=.coveragerc

tag_release:
  stage: tag
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - VERSION=$(grep '^__version__' whatismyip/__init__.py | cut -d'"' -f2)
    - TAG="v${VERSION}"
    - echo "Detected version ${TAG}"
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
        echo "Tag ${TAG} already exists — skipping."
      else
        git tag -a "${TAG}" -m "Release ${TAG}"
        git push origin "${TAG}"
        echo "Created and pushed ${TAG}"
      fi

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
